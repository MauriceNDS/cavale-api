services:
  postgres:
    image: postgres:18-alpine
    container_name: cavale-postgres
    environment:
      POSTGRES_DB: cavale
      POSTGRES_USER: cavale
      POSTGRES_PASSWORD: cavale
    ports:
      - "5432:5432"
    volumes:
      - cavale-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cavale -d cavale"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cavale-pgdata:
