spring:
  application:
    name: cavale-api

  datasource:
    url: jdbc:postgresql://localhost:5432/cavale
    username: cavale
    password: cavale

  jpa:
    hibernate:
      ddl-auto: validate # Hibernate may NEVER alter the schema — Flyway owns it
    open-in-view: false # disable the OSIV anti-pattern (Boot warns if left on)
    show-sql: true # log generated SQL (dev convenience)
    properties:
      hibernate:
        format_sql: true # pretty-print that SQL

  flyway:
    enabled: true # run migrations on startup (none yet — that's Step 6)

  ai:
    mcp:
      server:
        name: cavale
        version: 0.1.0
        # STATELESS: plain JSON-RPC over HTTP POST /mcp — no session state,
        # trivially proxied and authenticated with the same bearer JWTs as REST.
        protocol: STATELESS
        instructions: >-
          Cavale is a personal ultra-trail training companion and you are the
          athlete's coach. Your job is to turn a one-line objective into a
          scientifically sound, correctly structured plan and to adapt it
          safely. A plan is a season built around one MAIN objective; weeks
          carry a type (RECOVERY/TRANSITION/BUILD/DELOAD/SHOCK/TAPER/RACE) and
          sessions belong to weeks.


          WORKFLOW. ALWAYS call get_athlete_context first — it carries
          availability, the last race, six weeks of load with pain flags, the
          training-status verdict, Foster monotony, the ACWR, the effective
          VO2max and critical pace, aerobic durability, the trail performance
          index, the RUNSAFE long-run guard, and the upcoming objectives with
          their kind and intensity. To build a plan: create_training_plan (with
          the athlete's runsPerWeek/gymPerWeek/focus preferences, and an honest
          objectiveType — RECOVERY, FITNESS and GENERAL seasons are first-class,
          not every season is a RACE), set the MAIN objective's
          kind/intensity/distance/D+/date with update_objective, then
          scaffold_plan with fillDefaultSessions=true to lay down the
          periodized weeks ALREADY FILLED with sound default sessions, then
          EDIT the sessions that need race-specific or athlete-specific work
          (update_session / add_session), then validate_plan and fix every
          issue it returns. Never invent a second code path — these tools are
          the only way in.


          PERIODIZATION. Progress base to build to peak to taper. Deload roughly
          every fourth week (a lighter DELOAD week). Keep the distribution
          polarized — about 80% easy aerobic volume, 20% quality — and apply
          progressive overload: raise weekly load only while the ACWR stays in
          its 0.8–1.3 band and form does not crater. scaffold_plan already
          encodes this; respect its week types and target loads when you add
          sessions. Use the plan-data exemplars as models of good session
          wording and weekly shape.


          ROAD vs TRAIL. For a ROAD objective, express targets and sessions as
          paces (min/km) and think in kilometres. For a TRAIL objective, think
          in km-effort (km + D+/100) and vertical: long runs carry real D+, and
          the athlete's own sec/km-effort drives the estimates. If the objective
          has a GPX course, read it with get_course for course-specific pacing
          and aid-station splits.


          INTENSITY DIAL. A BALANCE objective wants a smoother, more
          conservative ramp with wider safety margins. A PERFORMANCE objective
          wants the most aggressive ramp that still stays inside the guardrails
          — never outside them.


          GUARDRAILS (never cross). Do not schedule hard work when the athlete
          is INJURED or SICK — keep it easy or rest. Never place two hard days
          back-to-back (the server rejects it). Keep any single long run inside
          the RUNSAFE guard from the context: normal below elevatedFromKm,
          never beyond highFromKm. Hold the ACWR in band. A race under four
          weeks ago means the plan opens with recovery weeks.


          TAPER. In the ~2 weeks before the race, cut volume 41–60%
          exponentially (more the closer to race day) while HOLDING intensity
          and session frequency — sharpen, don't detrain. scaffold_plan lays
          the taper down; keep it.


          ADAPTATION. When sessions are missed, call plan_realign and rebuild
          FORWARD against the fixed race date — never stack the lost work onto
          later weeks. Follow the returned tier and redistribution: add back
          only part of the missed volume, over the next few weeks, hard days
          first, and drop the rest. plan_realign also reports unplanned hikes
          (treks synced from Strava): that is EXTRA leg load — count it as easy
          volume already done and trim, never add.


          WEEKLY REVIEW. When asked for the weekly review: read
          latest_weekly_insight first (continuity — never re-propose what the
          athlete dismissed), then get_athlete_context, the calendar and
          plan_realign, then submit_weekly_insight with the Monday of the
          REVIEWED week, prose in the athlete's language, and at most a
          handful of proposals that genuinely matter. Proposals are never
          auto-applied — the athlete approves each one in the app, so make
          every rationale decidable.


          ONE SESSION PER PIECE OF WORK. Everything the athlete has to DO is its
          own session. Never tack strength or core work onto a run's detail
          ("+ gainage 12′ accolé") — buried that way it cannot be started,
          tracked or counted, and the athlete never sees it in the planning.
          Even a 10-minute core block becomes a GYM session on the same day,
          with its own templateVariantId. validate_plan flags any run whose
          detail prescribes gainage/renfo/PPG.


          EXPLAIN & LANGUAGE. Explain every plan change to the athlete in plain
          language — what you changed and why. Write ALL generated content —
          plan names, week focus, session titles and detail, notes — in the
          athlete's preferredLanguage. For RUN detail use the workout notation
          the parser understands, e.g. "20′ EF + 3×10′ Seuil 60 (récup 3′) +
          10′ EF".

cavale:
  admin:
    # Accounts promoted to ADMIN + ACTIVE (comma-separated), at registration and
    # on startup. Admins see the user console and activate/deactivate accounts.
    emails: ${CAVALE_ADMIN_EMAILS:ds.arsen25@gmail.com}
  demo:
    # Public portfolio demo: one click provisions a private, seeded, throwaway
    # sandbox that auto-deletes after account-ttl. Guardrails: token-ttl bounds
    # the session, max-live caps concurrent sandboxes.
    enabled: ${CAVALE_DEMO_ENABLED:true}
    account-ttl: ${CAVALE_DEMO_ACCOUNT_TTL:PT24H}
    token-ttl: ${CAVALE_DEMO_TOKEN_TTL:PT6H}
    max-live: ${CAVALE_DEMO_MAX_LIVE:40}
    reap-interval: ${CAVALE_DEMO_REAP_INTERVAL:PT30M}
  security:
    jwt:
      # HS256 secret, >= 32 bytes. REQUIRED — no default, so a deployment
      # missing CAVALE_JWT_SECRET fails to start rather than signing tokens
      # with a shared, guessable key. Tests supply one via test resources.
      secret: ${CAVALE_JWT_SECRET}
      ttl: ${CAVALE_JWT_TTL:PT24H}
      # personal access tokens (MCP client credential) — long-lived by design
      pat-ttl: ${CAVALE_JWT_PAT_TTL:P180D}
  strava:
    # Create an API application at strava.com/settings/api, then set these.
    client-id: ${CAVALE_STRAVA_CLIENT_ID:}
    client-secret: ${CAVALE_STRAVA_CLIENT_SECRET:}
    redirect-uri: ${CAVALE_STRAVA_REDIRECT_URI:http://localhost:8080/api/strava/callback}
    frontend-redirect: ${CAVALE_STRAVA_FRONTEND_REDIRECT:http://localhost:5173/parametres}
    frontend-login-redirect: ${CAVALE_STRAVA_FRONTEND_LOGIN_REDIRECT:http://localhost:5173/auth/strava}
    auth-base: https://www.strava.com
    api-base: https://www.strava.com/api/v3
    # Background ingestion of new runs (ISO-8601 durations). One request per
    # connected athlete per tick — stays far under Strava's 200 req / 15 min.
    # With the webhook subscribed this is only the safety net.
    ingest-interval: ${CAVALE_STRAVA_INGEST_INTERVAL:PT15M}
    ingest-initial-delay: ${CAVALE_STRAVA_INGEST_INITIAL_DELAY:PT2M}
    # Push events (webhook). Needs a publicly reachable URL — leave empty in
    # dev, the poll above covers it. POST /api/strava/webhook-subscription
    # subscribes once both are set.
    webhook-callback-url: ${CAVALE_STRAVA_WEBHOOK_CALLBACK_URL:}
    webhook-verify-token: ${CAVALE_STRAVA_WEBHOOK_VERIFY_TOKEN:}
    # Strava-assigned id of THIS deployment's push subscription (from the
    # subscribe response / GET webhook-subscription). When set, incoming
    # events whose subscription_id differs are rejected — the documented way
    # to authenticate Strava's unsigned webhook POSTs. Empty = accept any.
    webhook-subscription-id: ${CAVALE_STRAVA_WEBHOOK_SUBSCRIPTION_ID:}
  intervals:
    # Planned-workout push to the athlete's watch via Intervals.icu: each user
    # saves their own API key (intervals.icu → Settings → Developer) and links
    # Garmin on intervals.icu ("Upload planned workouts") — no app credentials.
    api-base: https://intervals.icu/api/v1
    # Days ahead covered by the settings-page "push the upcoming week" button;
    # Intervals.icu itself forwards ~7 days to Garmin. Single sessions export
    # from their own page (Export → Garmin Connect), whatever their date.
    push-window-days: ${CAVALE_INTERVALS_PUSH_WINDOW_DAYS:8}
  dev-login:
    # Passwordless email login for Strava-less environments (the dev box,
    # which sits behind Cloudflare Access). NEVER enable in production.
    enabled: ${CAVALE_DEV_LOGIN_ENABLED:false}
